app = "1ly-mcp-server"
primary_region = "sjc"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  MCP_TRANSPORT = "http"
  MCP_HTTP_HOST = "0.0.0.0"
  MCP_HTTP_PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "10s"
  timeout = "2s"
  method = "GET"
  path = "/health"
